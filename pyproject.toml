[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "membook"
version = "0.2.0"
description = "A hierarchical reasoning-based memory framework for hallucination-resistant LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Tongshu Bian"},
    {name = "Yunxin Li"},
    {name = "Zhenran Xu"},
    {name = "Tianqi Shi"},
    {name = "Longyue Wang"},
    {name = "Baotian Hu"},
    {name = "Min Zhang"},
]
maintainers = [
    {name = "MemBook Team", email = "zhengliu1026@gmail.com"},
]
keywords = ["ai", "memory", "agent", "llm", "nlp", "membook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "tiktoken>=0.7.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dense = [
    "faiss-cpu>=1.7.4",
    "numpy>=1.23.0",
    "requests>=2.28.0",
]
dense-local = [
    "FlagEmbedding>=1.2.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.23.0",
    "requests>=2.28.0",
    "torch>=2.0.0",
]
bm25 = [
    "pyserini>=0.22.0,<0.23.0",
]
evaluation = [
    "backoff>=2.2.0",
    "datasets>=2.18.0",
    "nltk>=3.8.0",
    "pandas>=1.5.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.2.0",
]
vllm = [
    "vllm>=0.6.0",
]
dev = [
    "black>=23.0",
    "build>=1.0.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "pytest>=7.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/springCozyRock/MemBook"
Repository = "https://github.com/springCozyRock/MemBook"
Issues = "https://github.com/springCozyRock/MemBook/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["membook*", "gam*"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
